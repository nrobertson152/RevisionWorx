# Desktop 0.1.0 Alpha (Issue #13): full suite including offscreen PySide6 widget tests.
# Lean on purpose: one Linux and one Windows job, no release or deployment steps.
name: Desktop alpha

on:
  push:
    branches:
      - feature/desktop-alpha
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-alpha-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: "${{ matrix.os }} / Python 3.11"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Versions
        run: python -c "import sys, PySide6, PySide6.QtCore as c; print(sys.version); print('PySide6', PySide6.__version__, 'Qt', c.qVersion())"
      - name: Qt widget tests (must not be skipped)
        run: python -m pytest -q -ra -m qt tests/test_qt_gui.py tests/test_qt_desktop_alpha.py tests/test_qt_desktop_alpha_rc.py tests/test_qt_desktop_alpha_journey.py
      - name: Full suite
        run: python -m pytest -q -ra
      - name: Window size on the native Windows platform (real fonts, not offscreen)
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: windows
        run: python -m pytest -q -ra -s -m qt tests/test_qt_desktop_alpha_rc.py -k "minimum_size_fits or long_paths"

  # This GUI on the core that QA and Distributed Systems accepted (scoped), without changing either branch:
  # the merge exists only on the runner. Update the pin only for a core commit with independent acceptance.
  accepted-core:
    name: "${{ matrix.os }} / GUI merged with accepted core"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      ACCEPTED_CORE: fe8a179f0203ef08151dc8459c84609dc639c4fe
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0
      - name: Merge the accepted core on the runner only
        run: |
          git -c user.name=ci -c user.email=ci@invalid merge --no-commit --no-ff ${{ env.ACCEPTED_CORE }}
          git rev-parse HEAD MERGE_HEAD
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Full suite on the merged tree
        run: python -m pytest -q -ra

  # Real process, real X display, real keystrokes (Linux only). Not a person, and not Windows.
  real-display:
    name: "ubuntu-latest / keyboard walkthrough on a real X display"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install X tools and Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool openbox imagemagick libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xkb1 libxcb-render-util0 libxcb-image0
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Walkthrough
        run: xvfb-run -a -s "-screen 0 1366x768x24" python tests/e2e_x11_walkthrough.py --shots shots
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walkthrough-screenshots
          path: shots
          retention-days: 14
