# Desktop 0.1.0 Alpha (Issue #13): full suite including offscreen PySide6 widget tests.
# Lean on purpose: one Linux and one Windows job, no release or deployment steps.
name: Desktop alpha

on:
  push:
    branches:
      - feature/desktop-alpha
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-alpha-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: "${{ matrix.os }} / Python 3.11"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Versions
        run: python -c "import sys, PySide6, PySide6.QtCore as c; print(sys.version); print('PySide6', PySide6.__version__, 'Qt', c.qVersion())"
      - name: Qt widget tests (must not be skipped)
        run: python -m pytest -q -ra -m qt tests/test_qt_gui.py tests/test_qt_desktop_alpha.py
      - name: Full suite
        run: python -m pytest -q -ra
      - name: Window size on the native Windows platform (real fonts, not offscreen)
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: windows
        run: python -m pytest -q -ra -s -m qt tests/test_qt_desktop_alpha_rc.py -k "minimum_size_fits or long_paths"
