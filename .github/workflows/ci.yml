# RevisionWorx CI: the full suite (core, CLI, BOM, change control, doctor and offscreen Qt GUI) on real Linux and
# Windows, because lock and file-sharing behaviour differs. Replaces the per-branch, per-agent workflows that ran
# before the branches were consolidated for 1.0.0.
name: CI

on:
  push:
    branches: [main, 'integration/**', 'release/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # main keeps a run for every SHA (exact-SHA evidence); on other branches a newer push supersedes the older run.
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tests:
    name: "${{ matrix.os }} / Python ${{ matrix.python }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.10'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: windows-latest, python: '3.11'}
          - {os: windows-latest, python: '3.13'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0
      - run: python -m pip install -e ".[dev]"
      - name: Versions
        run: python -c "import sys, PySide6, PySide6.QtCore as c; print(sys.version); print('PySide6', PySide6.__version__, 'Qt', c.qVersion())"
      - name: Qt widget tests (must not be skipped)
        run: python -m pytest -q -ra -m qt
      - name: Full suite
        if: success() || failure()   # still report everything when the Qt step failed
        run: python -m pytest -q -ra --durations=15
      - name: Windows contention, repeated (real sharing violations)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            echo "trial $i"
            python -m pytest -q tests/test_windows_sharing.py -k process_contention
            python -m pytest -q tests/test_documents.py -k test_checkout_race_between_processes_has_one_winner
          done
      - name: Native Windows window size (real fonts)
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: windows
        run: python -m pytest -q -ra -s -m qt tests/test_qt_desktop_alpha_rc.py -k "minimum_size_fits or long_paths"

  installed:
    name: "${{ matrix.os }} / clean wheel install, real entry points"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, platform: windows}
          - {os: ubuntu-latest, platform: offscreen}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0
      - name: Build wheel and sdist, install the wheel in a clean venv
        shell: bash
        run: |
          python -m pip install -q build
          python -m build
          python -m venv "$RUNNER_TEMP/venv"
          if [ "$RUNNER_OS" = Windows ]; then py="$RUNNER_TEMP/venv/Scripts/python.exe"; else py="$RUNNER_TEMP/venv/bin/python"; fi
          whl=$(ls dist/*.whl)
          "$py" -m pip install -q "${whl}[gui]"
          echo "VENV_PY=$py" >> "$GITHUB_ENV"
      - name: Smoke from outside the source tree
        shell: bash
        env:
          QT_QPA_PLATFORM: ${{ matrix.platform }}
        run: |
          src="$PWD"
          cd "$RUNNER_TEMP"
          "$VENV_PY" "$src/tests/smoke_installed_gui.py"
      - name: Keep the built distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist
          retention-days: 14

  real-display:
    name: "ubuntu-latest / keyboard walkthrough on a real X display"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install X tools and Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool openbox imagemagick libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xkb1 libxcb-render-util0 libxcb-image0
      - run: python -m pip install -e ".[dev]"
      - name: Walkthrough
        run: xvfb-run -a -s "-screen 0 1366x768x24" python tests/e2e_x11_walkthrough.py --shots shots
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walkthrough-screenshots
          path: shots
          retention-days: 14
