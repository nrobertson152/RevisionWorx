# Independent exact-source QA: production remains unmodified.
name: QA journal precommit exact source

on:
  push:
    branches: [qa/testing-infrastructure]
    paths:
      - 'tests/qa/test_journal_precommit_fail_closed.py'
      - '.github/workflows/qa-journal-precommit-exact-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  journal-precommit:
    name: "${{ matrix.os }} / Python ${{ matrix.python }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - name: Checkout immutable corrected production
        uses: actions/checkout@v4
        with:
          ref: 3cc42e13c442d0b8ce7ad9e9d8ee85b4615af194
          path: product
          persist-credentials: false
      - name: Checkout exact QA event commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: qa
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Assert source and test identity; stage independent fixture
        shell: python
        run: |
          import pathlib, shutil, subprocess, os
          def rev(path):
              return subprocess.check_output(['git', '-C', path, 'rev-parse', 'HEAD'], text=True).strip()
          production = rev('product')
          qa = rev('qa')
          print('PRODUCTION_SHA=' + production)
          print('QA_TEST_SHA=' + qa)
          assert production == '3cc42e13c442d0b8ce7ad9e9d8ee85b4615af194'
          assert qa == os.environ['GITHUB_SHA']
          src = pathlib.Path('qa/tests/qa/test_journal_precommit_fail_closed.py')
          assert src.is_file()
          dst = pathlib.Path('product/tests/qa/test_journal_precommit_fail_closed.py')
          dst.parent.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(src, dst)
      - name: Install test runner and production package
        working-directory: product
        run: python -m pip install -e . pytest
      - name: Run four strict fail-closed precommit assertions
        working-directory: product
        run: python -m pytest -q -ra tests/qa/test_journal_precommit_fail_closed.py
