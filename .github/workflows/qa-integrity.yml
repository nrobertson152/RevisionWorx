# Independent QA branch validation; no release or deployment steps.
name: QA integrity (independent)
on:
  push:
    branches:
      - qa/testing-infrastructure
  pull_request:
    branches:
      - phase1-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-and-qa:
    name: "${{ matrix.os }} / Python ${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run independent QA tests
        run: python -m pytest -q -ra tests/qa
      - name: Run full regression suite
        run: python -m pytest -q -ra

# A green run is evidence only for this specific runner and branch revision.
# It does not certify live PySide6 widgets, real Windows desktop interaction,
# SMB/NFS semantics, or cross-host recovery.
