# Independent QA branch validation; no release or deployment steps.
name: QA integrity (independent)
on:
  push:
    branches:
      - qa/testing-infrastructure
    paths-ignore:
      - 'docs/**'
  pull_request:
    branches:
      - phase1-foundation
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-and-qa:
    # GitHub PR merge checkout covers Phase 1+QA. Don't repeat on push.
    if: github.event_name != 'push'
    name: "${{ matrix.os }} / Python ${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-xinerama0
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run independent QA tests
        run: python -m pytest -q -ra tests/qa --ignore=tests/qa/test_core_96f9_cad_provenance.py
      - name: Run full regression suite
        run: python -m pytest -q -ra --ignore=tests/qa/test_core_96f9_cad_provenance.py

# The Phase 1 PR job explicitly excludes a Phase 2-only CAD module whose\n# top-level imports otherwise fail collection before any Phase 1 assertions.\n# Phase 2 coverage remains in the separate pinned integrated job below.\n# A green run validates actual Qt widgets offscreen but does not certify an
# installed native GUI, SMB/NFS semantics, or cross-host recovery.

  resolve-phase2-head:
    # Capture ONE immutable Phase 2 source SHA, preventing mixed-app matrix jobs
    # if Claude pushes another commit while runners start.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2-documents
      - id: pin
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD

  phase2-stacked-regressions:
    name: "Phase 2 integrated QA / ${{ matrix.os }} Python ${{ matrix.python-version }}"
    if: github.event_name != 'pull_request'
    needs: resolve-phase2-head
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout Claude's stacked Phase 2 implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-phase2-head.outputs.sha }}
          path: phase2
      - name: Checkout QA engineering branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: qa
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Record exact integrated revisions
        run: |
          echo "Phase 2 commit: $(git -C phase2 rev-parse HEAD)"
          echo "QA tests commit: $(git -C qa rev-parse HEAD)"
      - name: Install Linux Qt libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-xinerama0
      - name: Overlay only independent QA tests and fixtures into disposable Phase 2 checkout
        shell: python
        run: |
          from pathlib import Path
          import shutil
          shutil.copytree(Path("qa/tests/qa"), Path("phase2/tests/qa"), dirs_exist_ok=True)
      - name: Install stacked implementation and test requirements
        working-directory: phase2
        run: python -m pip install -e ".[dev]"
      - name: Run independent Phase 2 QA regressions
        working-directory: phase2
        run: python -m pytest -q -ra tests/qa
      - name: Run entire stacked Phase 2 suite
        working-directory: phase2
        run: python -m pytest -q -ra

# The Phase 2 job only overlays QA tests in the runner's disposable checkout.
# It does not merge branches, write GitHub refs, or change Claude's branch.
