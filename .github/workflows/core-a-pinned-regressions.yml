name: Core A pinned Phase 2 independent regression evidence

on:
  push:
    branches:
      - core/independent-journal-schema-regressions
    paths:
      - 'tests/test_core_independent_journal_shape.py'
      - 'tests/test_core_adr017_ordered_checks_restart.py'
      - '.github/workflows/core-a-pinned-regressions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-negative-control:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - name: Checkout role-owned tests
        uses: actions/checkout@v4
        with:
          path: role-tests
      - name: Checkout immutable historical production baseline
        uses: actions/checkout@v4
        with:
          ref: f01b37d345c5208ab0fa520588a2abe8c66c894a
          path: production
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test runner
        run: python -m pip install pytest
      - name: Verify immutable production source and test provenance
        shell: bash
        run: |
          test "$(git -C production rev-parse HEAD)" = "f01b37d345c5208ab0fa520588a2abe8c66c894a"
          echo "PRODUCTION=$(git -C production rev-parse HEAD)"
          echo "TESTS=$(git -C role-tests rev-parse HEAD)"
          cp role-tests/tests/test_core_independent_journal_shape.py production/tests/
          cp role-tests/tests/test_core_adr017_ordered_checks_restart.py production/tests/
      - name: Run strict acceptance tests against historical defective source
        working-directory: production
        run: python -m pytest -q -ra tests/test_core_independent_journal_shape.py tests/test_core_adr017_ordered_checks_restart.py
