name: RevisionWorx TEST-ONLY merge-readiness candidate exact current heads

on:
  push:
    branches:
      - integration/openschematix
    paths:
      - 'tools/packaging/stage_corrected_core_gui.py'
      - 'tools/packaging/stage_merge_readiness_tests.py'
      - 'tools/packaging/test_stage_corrected_core_gui.py'
      - 'tools/packaging/alpha_frozen_probe.py'
      - 'tools/packaging/smoke_alpha.py'
      - '.github/workflows/revisionworx-merge-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: revisionworx-merge-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  composite-test-only:
    # NOT a merge/release/backport/production gating workflow.
    # P0 current-head candidate. Earlier scoped acceptance does not transfer to these SHAs.
    # Build: disposable mixed checkout only; no production source ref is modified.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - name: Checkout Integration test harness
        uses: actions/checkout@v4
      - name: Checkout exact latest Phase 2 core
        uses: actions/checkout@v4
        with:
          repository: nrobertson152/RevisionWorx
          ref: 22a5273d4740b3a7af8e8cb5cc3565e4336b763b
          path: external/corrected-core
          persist-credentials: false
      - name: Checkout exact latest desktop alpha
        uses: actions/checkout@v4
        with:
          repository: nrobertson152/RevisionWorx
          ref: bd52cdf0c89fcd1dbc03d42951ba8e4a7de5da4f
          path: external/desktop-alpha
          persist-credentials: false
      - name: Set up Python 3.11 for disposable BUILD only
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Linux Qt dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xkb1 libxcb-icccm4 libxcb-shape0
      - name: Validate packaging safeguards
        run: python tools/packaging/test_builder.py
      - name: Verify composite staging rejects dirty checkouts and bad SHAs
        run: python tools/packaging/test_stage_corrected_core_gui.py
      - name: Stage exact two-SHA experimental composite and receipt
        run: >-
          python tools/packaging/stage_corrected_core_gui.py
          --core external/corrected-core
          --gui external/desktop-alpha
          --receipt corrected-core-gui-source-receipt.json
          --core-sha 22a5273d4740b3a7af8e8cb5cc3565e4336b763b
          --gui-sha bd52cdf0c89fcd1dbc03d42951ba8e4a7de5da4f
      - name: Stage exact GUI regression tests with a separate hash manifest
        run: >-
          python tools/packaging/stage_merge_readiness_tests.py
          --core external/corrected-core
          --gui external/desktop-alpha
          --receipt current-merge-candidate-gui-test-receipt.json
          --core-sha 22a5273d4740b3a7af8e8cb5cc3565e4336b763b
          --gui-sha bd52cdf0c89fcd1dbc03d42951ba8e4a7de5da4f
      - name: Run native full combined core and desktop GUI regression suite
        working-directory: external/corrected-core
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install --disable-pip-version-check --no-input -e ".[dev]"
          python -m pytest -q -ra
      - name: Build disposable frozen combined GUI and CLI, then assert Qt and journal lifecycle
        run: >-
          python tools/packaging/build.py
          --source external/corrected-core
          --output corrected-core-compat-output
          --expected-sha 22a5273d4740b3a7af8e8cb5cc3565e4336b763b
          --alpha-acceptance
      - name: Linux no-Python network-none combined frozen runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker build -f tools/packaging/offline_container.Dockerfile -t revisionworx-compat-offline tools/packaging
          docker run --rm --network none --cap-drop ALL --read-only \
            --tmpfs /tmp:rw,exec,nosuid,size=768m \
            --mount "type=bind,src=${{ github.workspace }}/corrected-core-compat-output/dist,dst=/bundles,readonly" \
            --mount "type=bind,src=${{ github.workspace }}/tools/packaging,dst=/harness,readonly" \
            revisionworx-compat-offline /bin/sh /harness/smoke_alpha_container.sh
      - name: Windows local path and UNC loopback probes
        if: runner.os == 'Windows'
        run: >-
          python tools/packaging/probe_windows_paths.py
          --cli corrected-core-compat-output/dist/RevisionWorxCLI/RevisionWorxCLI.exe
      - name: Record TEST ONLY two-source provenance
        if: always()
        run: |
          python -c "from pathlib import Path; x=Path('corrected-core-gui-source-receipt.json'); print(x.read_text() if x.exists() else 'source staging receipt unavailable')"
          python -c "from pathlib import Path; x=Path('current-merge-candidate-gui-test-receipt.json'); print(x.read_text() if x.exists() else 'GUI test receipt unavailable')"
          python -c "from pathlib import Path; x=Path('corrected-core-compat-output/provenance.json'); print(x.read_text() if x.exists() else 'frozen build provenance unavailable')"
