name: QA ADR-019 rev4 negative-control old P1s (pinned)
on:
  push:
    branches: [qa/testing-infrastructure]
    paths: ['.github/workflows/qa-rev5-negative-control-pinned.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical:
    name: "${{ matrix.os }} / Python ${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d2b7a1cfead5b83acecce2252e70d0a155f146b7
          path: app
      - uses: actions/checkout@v4
        with:
          ref: 88b0f8d11981b1eec8658a6920ff76c6aa2addcf
          path: qa
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Copy exact independent P1 reproducer
        shell: python
        run: |
          import shutil
          from pathlib import Path
          path = Path("app/tests/qa")
          path.mkdir(parents=True, exist_ok=True)
          shutil.copy2("qa/tests/qa/test_rev4_protocol_only_p1.py", path)
      - name: Install exact vulnerable production source
        working-directory: app
        run: python -m pip install -e ".[dev]"
      - name: Inspect source and test SHAs
        shell: bash
        run: |
          git -C app rev-parse HEAD
          git -C qa rev-parse HEAD
          python --version
      - name: Verify exactly three UNSAFE reproducers and three strict safety XFAILs
        working-directory: app
        run: python -m pytest -q -ra tests/qa/test_rev4_protocol_only_p1.py
