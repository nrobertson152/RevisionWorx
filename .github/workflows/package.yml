# Standalone RevisionWorx builds (no Python needed by the user): a zip for Windows x64 and a tar.gz for
# Linux x86-64, each with the command line and the desktop window. Every build is started and checked here
# before it is kept: `revisionworx --version`, a workspace created and checked from the CLI, and the desktop
# window's --self-test (create a project, import a file, reopen). Artifacts only: this workflow never
# creates a GitHub Release or a tag (Director-only, AGENTS.md).
name: Package

on:
  push:
    branches: [main, 'integration/**', 'release/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: "${{ matrix.os }} standalone build"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, platform_name: windows-x64, qpa: windows}
          - {os: ubuntu-22.04, platform_name: linux-x86_64, qpa: offscreen}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0
      - name: Install build tools
        run: python -m pip install . "PySide6-Essentials>=6.5" "pyinstaller>=6.5"
      - name: Build
        run: pyinstaller packaging/revisionworx.spec --noconfirm --distpath dist --workpath build
      - name: Add licence and notices
        shell: bash
        run: |
          out=dist/RevisionWorx
          cp LICENSE README.md CHANGELOG.md packaging/THIRD_PARTY_NOTICES.txt "$out/"
          mkdir -p "$out/licenses"
          cp packaging/licenses/* "$out/licenses/"
          python - "$out/licenses" <<'EOF'
          import importlib.metadata as md, pathlib, shutil, sys
          dest = pathlib.Path(sys.argv[1])
          for dist_name in ("PySide6-Essentials", "shiboken6", "pyinstaller"):
              dist = md.distribution(dist_name)
              for f in dist.files or []:
                  name = f.name.lower()
                  if "licen" in name or "copying" in name or "notice" in name:
                      src = pathlib.Path(dist.locate_file(f))
                      if src.is_file():
                          shutil.copy(src, dest / f"{dist_name}-{f.name}")
          names = sorted(p.name for p in dest.iterdir())
          print(names)
          assert "LGPL-3.0.txt" in names
          EOF
      - name: Add the Linux desktop entry and icons
        if: runner.os == 'Linux'
        shell: bash
        run: |
          out=dist/RevisionWorx
          mkdir -p "$out/icons"
          cp revisionworx/gui/resources/revisionworx-*.png "$out/icons/"
          cp packaging/linux/install-desktop-entry.sh packaging/linux/revisionworx.desktop.in "$out/"
          chmod +x "$out/install-desktop-entry.sh"
      - name: Check the logo is in the build
        shell: bash
        run: |
          # the window's icon/splash images (branding.RESOURCES) must be inside the bundle
          for s in 16 24 32 48 64 128 256 512; do
            find dist/RevisionWorx -path "*revisionworx/gui/resources/revisionworx-$s.png" | grep -q . || { echo "missing $s px icon"; exit 1; }
          done
          find dist/RevisionWorx -path "*revisionworx/gui/resources/revisionworx.ico" | grep -q .
      - name: Check the Linux desktop entry installs and is valid
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y -qq desktop-file-utils
          home="$RUNNER_TEMP/desktop-home"
          XDG_DATA_HOME="$home" dist/RevisionWorx/install-desktop-entry.sh
          entry="$home/applications/revisionworx.desktop"
          cat "$entry"
          desktop-file-validate "$entry"
          grep -q "Exec=\"$PWD/dist/RevisionWorx/revisionworx-gui\" %f" "$entry"
          for s in 16 32 48 256; do test -s "$home/icons/hicolor/${s}x${s}/apps/revisionworx.png"; done
          XDG_DATA_HOME="$home" dist/RevisionWorx/install-desktop-entry.sh --remove
          test ! -e "$entry"
      - name: Check the build (command line)
        shell: bash
        run: |
          bin=dist/RevisionWorx/revisionworx
          "$bin" --version
          ws="$RUNNER_TEMP/pkg-ws"
          "$bin" init "$ws" --name "Package check"
          "$bin" -w "$ws" --cache-dir "$RUNNER_TEMP/pkg-cache" status
          "$bin" -w "$ws" doctor
          "$bin" -w "$ws" change list
      - name: Check the build (desktop window self-test)
        shell: bash
        env:
          QT_QPA_PLATFORM: ${{ matrix.qpa }}
        run: |
          report="$RUNNER_TEMP/selftest.txt"
          if [ "$RUNNER_OS" = Windows ]; then
            # a windowed exe returns at once from bash; wait for it and take its exit code
            pwsh -NoProfile -Command "\$p = Start-Process -FilePath 'dist/RevisionWorx/revisionworx-gui.exe' -ArgumentList '--self-test','$report' -Wait -PassThru; exit \$p.ExitCode"
          else
            dist/RevisionWorx/revisionworx-gui --self-test "$report"
          fi
          cat "$report"
          grep -q "self-test PASSED" "$report"
      - name: Archive and checksum
        shell: bash
        run: |
          version=$(python -c "import revisionworx; print(revisionworx.__version__)")
          name="RevisionWorx-${version}-${{ matrix.platform_name }}"
          cd dist
          mv RevisionWorx "$name"
          if [ "$RUNNER_OS" = Windows ]; then
            7z a -tzip -bd "$name.zip" "$name" > /dev/null
            archive="$name.zip"
          else
            tar -czf "$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          sha256sum "$archive" > "$archive.sha256"
          cat "$archive.sha256"
          echo "ARCHIVE=dist/$archive" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ matrix.platform_name }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          retention-days: 30
          if-no-files-found: error

  python-packages:
    name: "wheel and sdist"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - name: Checksums
        run: cd dist && sha256sum * | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: dist/*
          retention-days: 30
          if-no-files-found: error
