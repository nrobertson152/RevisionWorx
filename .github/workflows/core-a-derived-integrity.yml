name: Core A read-only derived-record integrity gates

on:
  push:
    branches: [core/independent-journal-schema-regressions]
    paths:
      - 'tests/test_core_readonly_derived_integrity.py'
      - '.github/workflows/core-a-derived-integrity.yml'
  pull_request:
    paths:
      - 'tests/test_core_readonly_derived_integrity.py'
      - '.github/workflows/core-a-derived-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  derived-record-integrity:
    name: derived record doctor / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          path: role-tests
      - uses: actions/checkout@v4
        with:
          ref: f01b37d345c5208ab0fa520588a2abe8c66c894a
          path: production
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Verify source and stage test-only fixture
        shell: bash
        run: |
          test "$(git -C production rev-parse HEAD)" = "f01b37d345c5208ab0fa520588a2abe8c66c894a"
          echo "PRODUCTION=$(git -C production rev-parse HEAD)"
          echo "TESTS=$(git -C role-tests rev-parse HEAD)"
          cp role-tests/tests/test_core_readonly_derived_integrity.py production/tests/
      - name: Run strict read-only derived-record integrity fixtures
        working-directory: production
        run: python -m pytest -q -ra tests/test_core_readonly_derived_integrity.py
