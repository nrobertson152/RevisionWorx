name: QA orphan-clear fixed-source before-after
on:
  push:
    branches: [qa/testing-infrastructure]
    paths: ['.github/workflows/qa-orphan-clear-pinned.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source:
    name: "${{ matrix.os }} Python 3.13 / ${{ matrix.case }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            case: vulnerable-366d435
            source: 366d4355abcde7543122551fadaab01ac9832e01
          - os: windows-latest
            case: vulnerable-366d435
            source: 366d4355abcde7543122551fadaab01ac9832e01
          - os: ubuntu-latest
            case: corrected-e5b38a6
            source: e5b38a69edd71eb580f5bae67a570d4def94eb8f
          - os: windows-latest
            case: corrected-e5b38a6
            source: e5b38a69edd71eb580f5bae67a570d4def94eb8f
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
          path: app
      - uses: actions/checkout@v4
        with:
          ref: 83f7b63f7b9968d1252ef20c5757540a3e553da4
          path: qa
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-xinerama0
      - name: Overlay only independent QA test into disposable source
        shell: python
        run: |
          from pathlib import Path
          import shutil
          target = Path("app/tests/qa")
          target.mkdir(parents=True, exist_ok=True)
          shutil.copy2(Path("qa/tests/qa/test_orphan_clear_adversarial.py"), target / "test_orphan_clear_adversarial.py")
      - name: Install exact source test dependencies
        working-directory: app
        run: python -m pip install -e ".[dev]"
      - name: Identify exact source and test SHA
        shell: bash
        run: |
          git -C app rev-parse HEAD
          git -C qa rev-parse HEAD
          python --version
      - name: Independent P1/P2 reproducer and safety oracles
        working-directory: app
        run: python -m pytest -q -ra tests/qa/test_orphan_clear_adversarial.py
