# Core (phase2-documents, PR #7). Non-Qt suite on real Linux and Windows, because lock and file-sharing
# behaviour differs. Qt widgets are covered by desktop-alpha.yml on the GUI branch. Four jobs at the Director's request.
name: Core

on:
  push:
    branches:
      - phase2-documents
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: "${{ matrix.os }} / Python ${{ matrix.python }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: windows-latest, python: '3.11'}
          - {os: windows-latest, python: '3.13'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . pytest
      - name: Full suite (Qt tests skip here)
        run: python -m pytest -q -ra --durations=15
      - name: Issue 10 contention, repeated (real sharing violations on Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            echo "trial $i"
            python -m pytest -q tests/test_windows_sharing.py -k process_contention --durations=3
          done
