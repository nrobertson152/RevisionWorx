name: Distributed Authority Research Tests

on:
  push:
    branches:
      - research/shared-filesystem-protocol
    paths:
      - "prototype/**"
      - ".github/workflows/distributed-authority-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-authority:
    name: SQLite authority (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Independent-process checkout and fencing tests
        run: python -m unittest -v prototype.test_authority prototype.test_coordinator_research prototype.test_immutable_manifest_research prototype.test_witnessed_coordinator prototype.test_record_batch_research prototype.test_request_identity_research

  phase1-stale-writer-reproduction:
    name: Phase 1 real-code fencing and cache-watermark probes (research)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout distributed research
        uses: actions/checkout@v4
        with:
          path: research
      - name: Checkout actual Phase 1 implementation
        uses: actions/checkout@v4
        with:
          ref: phase1-foundation
          path: phase1-foundation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Reproduce preflight/administrative-break publication race
        working-directory: research
        env:
          REVISIONWORX_PHASE1_CHECKOUT: ${{ github.workspace }}/phase1-foundation
        run: python -m unittest -v prototype.test_phase1_lock_race prototype.test_phase1_cache_watermark

  phase2-lock-break-order:
    name: ADR-019 successor safety and ADR-017 txid identity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout distributed research
        uses: actions/checkout@v4
        with:
          path: research
      - name: Checkout actual Phase 2 implementation
        uses: actions/checkout@v4
        with:
          ref: d656884b39401134149273dd0121ef620b76eb8e
          path: phase2-documents
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify revocation, successor safety and classify txid contract gap
        working-directory: research
        env:
          REVISIONWORX_PHASE2_CHECKOUT: ${{ github.workspace }}/phase2-documents
        run: python -m unittest -v prototype.test_phase2_lock_break_order prototype.test_phase2_lock_release_race prototype.test_phase2_orphan_recovery prototype.test_phase2_txid_check_reuse

  phase2-current-candidate-safety:
    name: Phase 2 ADR-017/019 corrected-candidate acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          path: research
      - uses: actions/checkout@v4
        with:
          ref: 2a2804820d4aca48b50026bdb7edfe8c241b1866
          path: phase2-documents
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify current Phase 2 and record strict unaccepted gaps
        working-directory: research
        env:
          REVISIONWORX_PHASE2_CHECKOUT: ${{ github.workspace }}/phase2-documents
        run: python -m unittest -v prototype.test_phase2_new_fixes_acceptance

  phase1-backport-owner-safety:
    name: Frozen Phase 1 backport ownership probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          path: research
      - uses: actions/checkout@v4
        with:
          ref: 36d1957fe8d7800659b488106ef6cec1fa0c6267
          path: phase1-backport
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Demonstrate obsolete stale release and positive safety xfail
        working-directory: research
        env:
          REVISIONWORX_BACKPORT_CHECKOUT: ${{ github.workspace }}/phase1-backport
        run: python -m unittest -v prototype.test_phase1_backport_release_race

  phase2-latest-adr-review:
    name: ADR-019 audit-first and ADR-021 digest interoperability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout isolated research tests
        uses: actions/checkout@v4
        with:
          path: research
      - name: Checkout exact Phase 2 reviewed source
        uses: actions/checkout@v4
        with:
          ref: 366d4355abcde7543122551fadaab01ac9832e01
          path: phase2-documents
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test administrative recovery crash/retry and canonical hash compatibility
        working-directory: research
        env:
          REVISIONWORX_PHASE2_CHECKOUT: ${{ github.workspace }}/phase2-documents
        run: python -m unittest -v prototype.test_phase2_orphan_clear_protocol prototype.test_phase2_identity_interop

  phase2-commit-authority-conformance:
    name: ADR-017 exact contract on witnessed batch prototype (Ubuntu 3.13)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout distributed research
        uses: actions/checkout@v4
        with:
          path: research
      - name: Checkout pinned Phase 2 contract
        uses: actions/checkout@v4
        with:
          ref: 366d4355abcde7543122551fadaab01ac9832e01
          path: phase2-documents
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test harness only
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run actual ADR-017 inherited contract against research adapter
        working-directory: research
        env:
          REVISIONWORX_PHASE2_CHECKOUT: ${{ github.workspace }}/phase2-documents
        run: python -m pytest -v -q prototype/test_phase2_contract_adapter.py

  phase2-rev3-independent-safety:
    name: Independent ADR-019 rev3 custody and CAS (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - name: Checkout independent research
        uses: actions/checkout@v4
        with:
          path: research
      - name: Checkout exact corrected production source
        uses: actions/checkout@v4
        with:
          ref: e5b38a69edd71eb580f5bae67a570d4def94eb8f
          path: phase2-documents
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Execute positive custody and serialization safety oracles
        working-directory: research
        env:
          REVISIONWORX_PHASE2_CHECKOUT: ${{ github.workspace }}/phase2-documents
        run: python -m unittest -v prototype.test_phase2_rev3_independent_acceptance

  phase2-rev3-protocol-only-boundary:
    name: ADR-019 protocol-only crashes and admin-conflict (${{ matrix.os }}, Py ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: research
      - uses: actions/checkout@v4
        with:
          ref: d2b7a1cfead5b83acecce2252e70d0a155f146b7
          path: phase2-documents
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify protocol-only custody crashes and per-incarnation authority conflict
        working-directory: research
        env:
          REVISIONWORX_PHASE2_CHECKOUT: ${{ github.workspace }}/phase2-documents
        run: python -m unittest -v prototype.test_phase2_rev3_protocol_boundary

  phase2-protocol-only-new-p1:
    name: Codex protocol-only P1 unsafe and strict safety gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          path: research
      - uses: actions/checkout@v4
        with:
          ref: d2b7a1cfead5b83acecce2252e70d0a155f146b7
          path: phase2-documents
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run exact-source P1 unsafe reproductions and unaccepted positive oracles
        working-directory: research
        env:
          REVISIONWORX_PHASE2_CHECKOUT: ${{ github.workspace }}/phase2-documents
        run: python -m unittest -v prototype.test_phase2_protocol_only_new_p1

  phase2-protocol-only-revoked-cleanup:
    name: Protocol-only stale revoked cleanup (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: research
      - uses: actions/checkout@v4
        with:
          ref: d2b7a1cfead5b83acecce2252e70d0a155f146b7
          path: phase2-documents
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run unsafe reproduction and unmet positive safety oracle on exact source
        working-directory: research
        env:
          REVISIONWORX_PHASE2_CHECKOUT: ${{ github.workspace }}/phase2-documents
        run: python -m unittest -v prototype.test_phase2_revoked_cleanup_protocol_only

  phase2-rev4-admin-break-acceptance:
    name: ADR-019 rev4 independent admin successor (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: research
      - uses: actions/checkout@v4
        with:
          ref: fe8a179f0203ef08151dc8459c84609dc639c4fe
          path: phase2-documents
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Exercise actual admin-break displaced-token safety and crash edge
        working-directory: research
        env:
          REVISIONWORX_PHASE2_CHECKOUT: ${{ github.workspace }}/phase2-documents
        run: python -m unittest -v prototype.test_phase2_admin_break_successor prototype.test_phase2_revoked_cleanup_rev4

  phase2-rev4-admin-break-old-control:
    name: ADR-019 rev3 administrative break unsafe baseline (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: research
      - uses: actions/checkout@v4
        with:
          ref: d2b7a1cfead5b83acecce2252e70d0a155f146b7
          path: phase2-documents
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Negative control must reject old candidate
        working-directory: research
        env:
          REVISIONWORX_PHASE2_CHECKOUT: ${{ github.workspace }}/phase2-documents
        shell: bash
        run: |
          set +e
          python -m unittest -v prototype.test_phase2_admin_break_successor prototype.test_phase2_revoked_cleanup_rev4
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then echo "Old vulnerable implementation unexpectedly passed"; exit 1; fi
          echo "Confirmed: vulnerable old source fails positive safety oracles"

  phase2-rev4-release-displacement-acceptance:
    name: ADR-019 rev4 independent release displacement (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: research
      - uses: actions/checkout@v4
        with:
          ref: fe8a179f0203ef08151dc8459c84609dc639c4fe
          path: phase2-documents
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify journal-effective displaced release and crash protection
        working-directory: research
        env:
          REVISIONWORX_PHASE2_CHECKOUT: ${{ github.workspace }}/phase2-documents
        run: python -m unittest -v prototype.test_phase2_release_displacement_rev4

  phase2-rev4-release-displacement-old-control:
    name: ADR-019 release displacement vulnerable source negative control (Ubuntu 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: research
      - uses: actions/checkout@v4
        with:
          ref: d2b7a1cfead5b83acecce2252e70d0a155f146b7
          path: phase2-documents
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Vulnerable source must fail specific crash-before-revocation oracle
        working-directory: research
        env:
          REVISIONWORX_PHASE2_CHECKOUT: ${{ github.workspace }}/phase2-documents
        shell: bash
        run: |
          set +e
          python -m unittest -v prototype.test_phase2_release_displacement_rev4 > negative-control.log 2>&1
          status=$?
          set -e
          cat negative-control.log
          if [ "$status" -eq 0 ]; then echo "FAIL: vulnerable source unexpectedly passed"; exit 1; fi
          if [ "$(grep -c "^FAIL: test_crash_before_displaced_token_revocation_remains_fail_closed " negative-control.log)" -ne 1 ]; then echo "FAIL: expected exactly the crash-safety oracle to reject vulnerable source"; exit 1; fi
          if grep -q "^ERROR:" negative-control.log; then echo "FAIL: harness error rather than safety rejection"; exit 1; fi
          echo "Expected negative control: crash-safety oracle FAILS on vulnerable source; ordinary release oracle PASSES"

  phase2-rev4-real-windows-sharing:
    name: ADR-019 rev4 genuine Win32 sharing denial (Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: research
      - uses: actions/checkout@v4
        with:
          ref: fe8a179f0203ef08151dc8459c84609dc639c4fe
          path: phase2-documents
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Exercise kernel-enforced handle denial and durable revocation
        working-directory: research
        env:
          REVISIONWORX_PHASE2_CHECKOUT: ${{ github.workspace }}/phase2-documents
        run: python -m unittest -v prototype.test_phase2_real_windows_sharing_rev4


  phase2-new-head-retry-composition:
    name: Core 22a5273 sharing retry composition (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
