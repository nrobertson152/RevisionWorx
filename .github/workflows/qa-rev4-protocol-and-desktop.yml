name: QA pinned protocol-boundary and desktop durability
on:
  push:
    branches: [qa/testing-infrastructure]
    paths: ['.github/workflows/qa-rev4-protocol-and-desktop.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent:
    name: "${{ matrix.target.name }} on ${{ matrix.os }} Python ${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
        target:
          - name: protocol
            source: d2b7a1cfead5b83acecce2252e70d0a155f146b7
            tests: 'tests/qa/test_rev4_protocol_boundary.py tests/test_lock_namespace_threat_model.py tests/test_orphan_clear_custody.py'
          - name: desktop
            source: f00aa31b6f66fbe0e78ff440aed7026e869138b3
            tests: 'tests/qa/test_desktop_alpha_integrity.py tests/test_desktop_alpha.py'
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.target.source }}
          path: app
      - uses: actions/checkout@v4
        with:
          ref: 7cc0493036f10e24107831c993dffecd6146ec87
          path: qa
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-xinerama0
      - name: Overlay independent QA tests without touching production
        shell: python
        run: |
          from pathlib import Path
          import shutil
          target = Path("app/tests/qa")
          target.mkdir(parents=True, exist_ok=True)
          for name in ("test_rev4_protocol_boundary.py", "test_desktop_alpha_integrity.py"):
              shutil.copy2(Path("qa/tests/qa") / name, target / name)
      - name: Install tested source and test dependencies
        working-directory: app
        run: python -m pip install -e ".[dev]"
      - name: Print exact source SHA, QA SHA and Python environment
        shell: bash
        run: |
          git -C app rev-parse HEAD
          git -C qa rev-parse HEAD
          python --version
      - name: Run target-specific positive acceptance and regression controls
        working-directory: app
        env:
          TEST_FILES: ${{ matrix.target.tests }}
        shell: bash
        run: |
          python -m pytest -q -ra $TEST_FILES
