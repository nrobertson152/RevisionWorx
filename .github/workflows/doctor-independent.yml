# Independent reviewer test-only RED gate, pinned to Phase 2 baseline.
# Reproduction must be safe even on the original defective source.
name: Independent doctor safety gates
on:
  pull_request:
    paths:
      - 'tests/test_doctor_independent_safety.py'
      - '.github/workflows/doctor-independent.yml'
      - 'revisionworx/doctor.py'
      - 'revisionworx/workspace.py'
      - 'revisionworx/cli.py'
  push:
    branches:
      - review/doctor-adversarial-gates-20261103
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: windows-latest, python: '3.11'}
          - {os: windows-latest, python: '3.13'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q -ra tests/test_doctor_independent_safety.py
