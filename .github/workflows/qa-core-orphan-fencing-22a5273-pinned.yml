name: QA P0 orphan fencing sharing denial native matrix (pinned)
on:
  push:
    branches: [qa/testing-infrastructure]
    paths: ['.github/workflows/qa-core-orphan-fencing-22a5273-pinned.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  custody:
    name: "${{ matrix.os }} / Python ${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 22a5273d4740b3a7af8e8cb5cc3565e4336b763b
          path: app
      - uses: actions/checkout@v4
        with:
          ref: fb131f652d3c018e32fb7d61b010b77a928cc897
          path: qa
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Copy independent fault reproduction into candidate test tree
        shell: python
        run: |
          import shutil
          from pathlib import Path
          dest = Path("app/tests/qa")
          dest.mkdir(parents=True, exist_ok=True)
          shutil.copy2("qa/tests/qa/test_core_22a5273_orphan_win_denial.py", dest)
      - name: Install exact candidate
        working-directory: app
        run: python -m pip install -e ".[dev]"
      - name: Show immutable tested versions
        shell: bash
        run: |
          git -C app rev-parse HEAD
          git -C qa rev-parse HEAD
          python --version
      - name: Run strict fail-closed and transient recovery acceptance (no XFAIL)
        working-directory: app
        run: python -m pytest -q -ra tests/qa/test_core_22a5273_orphan_win_denial.py
