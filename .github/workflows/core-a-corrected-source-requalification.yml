name: Core A corrected-source positive requalification (manual only)

# This workflow is intentionally separate from historical RED negative controls.
# Dispatch with a full 40-character corrected production commit SHA. A green
# result is scoped to the four listed suites, not a release or multi-host gate.
on:
  workflow_dispatch:
    inputs:
      production_sha:
        description: 'Exact 40-character corrected Phase 2 production commit SHA'
        required: true
        type: string

permissions:
  contents: read

jobs:
  corrected-source:
    name: corrected Phase 2 / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - name: Validate SHA input before checkout
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.production_sha }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::production_sha must be an exact 40-character hexadecimal commit SHA"
            exit 1
          fi
          if [[ "${SOURCE_SHA,,}" == "f01b37d345c5208ab0fa520588a2abe8c66c894a" ]]; then
            echo "::error::Historical defective source is not a corrected-source candidate"
            exit 1
          fi
      - name: Checkout immutable role-owned test revision
        uses: actions/checkout@v4
        with:
          path: role-tests
          persist-credentials: false
      - name: Checkout requested production revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.production_sha }}
          path: production
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install pytest
      - name: Pin and report exact sources; overlay ONLY independent test files
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.production_sha }}
        run: |
          actual="$(git -C production rev-parse HEAD)"
          if [[ "$actual" != "${SOURCE_SHA,,}" ]]; then
            echo "::error::Checked-out production SHA differs from requested SHA"
            exit 1
          fi
          echo "PRODUCTION_SHA=$actual"
          echo "ROLE_TEST_SHA=$(git -C role-tests rev-parse HEAD)"
          for name in test_core_independent_journal_shape.py test_core_crash_integrity_readonly.py test_core_adr017_ordered_checks_restart.py test_core_readonly_derived_integrity.py; do
            test -f "role-tests/tests/$name"
            cp "role-tests/tests/$name" production/tests/
          done
      - name: Strict corrected-source journal, crash, transaction and read-only gates
        working-directory: production
        run: >-
          python -m pytest -q -ra
          tests/test_core_independent_journal_shape.py
          tests/test_core_crash_integrity_readonly.py
          tests/test_core_adr017_ordered_checks_restart.py
          tests/test_core_readonly_derived_integrity.py
