name: QA P0 nested Windows lock read retry budget (pinned)
on:
  push:
    branches: [qa/testing-infrastructure]
    paths: ['.github/workflows/qa-core-nested-retry-p0-pinned.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    name: "${{ matrix.os }} / Python ${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 22a5273d4740b3a7af8e8cb5cc3565e4336b763b
          path: app
      - uses: actions/checkout@v4
        with:
          ref: 43df76f2c5d2aca2e0fb6547fae99b59e63b3eda
          path: qa
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Overlay independent reproducible P0 test only
        shell: python
        run: |
          import shutil
          from pathlib import Path
          dest = Path("app/tests/qa")
          dest.mkdir(parents=True, exist_ok=True)
          shutil.copy2("qa/tests/qa/test_core_22a5273_nested_retry_budget.py", dest)
      - name: Install exact core implementation
        working-directory: app
        run: python -m pip install -e ".[dev]"
      - name: Print frozen SHAs and Python interpreter
        shell: bash
        run: |
          git -C app rev-parse HEAD
          git -C qa rev-parse HEAD
          python --version
      - name: Run strict P0 lock-read retry budget, DO NOT XFAIL
        working-directory: app
        run: python -m pytest -q -ra tests/qa/test_core_22a5273_nested_retry_budget.py
