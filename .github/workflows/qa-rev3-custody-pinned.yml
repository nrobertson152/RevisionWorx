name: QA ADR-019 rev3 post-verification races (pinned)
on:
  push:
    branches: [qa/testing-infrastructure]
    paths: ['.github/workflows/qa-rev3-custody-pinned.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  race:
    name: "${{ matrix.os }} Python ${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e5b38a69edd71eb580f5bae67a570d4def94eb8f
          path: app
      - uses: actions/checkout@v4
        with:
          ref: 022275492a26dc08349248a28d9604ed104be4d1
          path: qa
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Linux Qt dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-xinerama0
      - name: Overlay QA-only adversarial tests
        shell: python
        run: |
          import shutil
          from pathlib import Path
          dest = Path("app/tests/qa")
          dest.mkdir(parents=True, exist_ok=True)
          shutil.copy2("qa/tests/qa/test_rev3_custody_path_races.py", dest)
      - name: Install exact implementation
        working-directory: app
        run: python -m pip install -e ".[dev]"
      - name: Identify exact SHAs
        shell: bash
        run: |
          git -C app rev-parse HEAD
          git -C qa rev-parse HEAD
          python --version
      - name: Execute independent two-writer counterexamples and safety oracles
        working-directory: app
        run: python -m pytest -q -ra tests/qa/test_rev3_custody_path_races.py
