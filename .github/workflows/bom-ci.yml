# Advanced BOM layer (issue #18, branch feature/advanced-bom). Lean on purpose: the BOM tests on
# Linux (oldest supported Python) and Windows (newest), plus the whole suite once on Linux to show the
# new package does not disturb the core. Qt tests skip here (no PySide6 installed).
name: BOM

on:
  push:
    branches:
      - feature/advanced-bom
    paths:
      - 'revisionworx/bom/**'
      - 'tests/test_bom_*.py'
      - 'tests/bom_helpers.py'
      - 'tests/fixtures/bom/**'
      - 'docs/bom/examples/**'
      - '.github/workflows/bom-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: "${{ matrix.os }} / Python ${{ matrix.python }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.10', full: true}
          - {os: windows-latest, python: '3.13', full: false}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . pytest
      - name: BOM tests
        run: python -m pytest -q -ra tests/test_bom_units_model.py tests/test_bom_graph.py tests/test_bom_validate_serialize.py tests/test_bom_csv.py tests/test_bom_diff_impact.py tests/test_bom_fileio_faults.py tests/test_bom_properties.py tests/test_bom_workspace.py tests/test_bom_cli_viewmodels.py tests/test_bom_catalog.py tests/test_bom_catalog_workspace.py tests/test_bom_catalog_persistence.py tests/test_bom_contract.py tests/test_bom_reference_preservation.py tests/test_bom_xlsx_purchasing.py
      - name: Full suite (core + BOM; Qt tests skip)
        if: matrix.full
        run: python -m pytest -q -ra
