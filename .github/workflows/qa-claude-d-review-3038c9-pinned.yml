name: QA independent Claude D PR20 corrected 3038c9 acceptance
on:
  push:
    branches: [qa/testing-infrastructure]
    paths: ['.github/workflows/qa-claude-d-review-3038c9-pinned.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    name: "${{ matrix.os }} Python ${{ matrix.python }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3038c9b89e09f45b99bb3ae6a5d09a1d4066e823
          path: app
      - uses: actions/checkout@v4
        with:
          ref: c7e90e5936059d515699ac006d0e7797aad10eb0
          path: qa
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Overlay independent reviewed contracts
        shell: python
        run: |
          from pathlib import Path
          import shutil
          dst=Path("app/tests/qa")
          dst.mkdir(parents=True,exist_ok=True)
          shutil.copy2("qa/tests/qa/test_change_control_pr20_independent_review.py",dst)
      - name: Install exact change-control candidate
        working-directory: app
        run: python -m pip install -e ".[dev]"
      - name: Prove fixed code and test source SHAs
        shell: bash
        run: |
          git -C app rev-parse HEAD
          git -C qa rev-parse HEAD
          python --version
      - name: Claude D official workflow and workspace regressions
        working-directory: app
        run: python -m pytest -q -ra tests/test_changes_model.py tests/test_changes_workflow.py tests/test_changes_service.py tests/test_changes_workspace.py tests/test_changes_reports.py
      - name: Strict independent approval, replay and restart verification
        working-directory: app
        run: python -m pytest -q -ra tests/qa/test_change_control_pr20_independent_review.py
