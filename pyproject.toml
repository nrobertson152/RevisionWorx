[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "revisionworx"
dynamic = ["version"]
description = "Offline, accountless engineering PDM that integrates with OpenSchematix"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = []          # core and CLI: standard library only
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Manufacturing",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.5"]   # LGPL-3.0 (GPL-compatible); see docs/ARCHITECTURE.md ADR-009
dev = ["pytest", "PySide6-Essentials>=6.5"]

[project.scripts]
revisionworx = "revisionworx.cli:main"

[project.gui-scripts]
revisionworx-gui = "revisionworx.gui.app:main"

[tool.setuptools.dynamic]
version = { attr = "revisionworx.__version__" }

[tool.setuptools.packages.find]
include = ["revisionworx*"]

[tool.setuptools.package-data]
"revisionworx.gui" = ["resources/*.png", "resources/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "qt: needs PySide6; runs offscreen (QT_QPA_PLATFORM=offscreen); skipped when PySide6 is missing",
]
